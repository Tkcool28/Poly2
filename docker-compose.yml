services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POLYCOPY_POSTGRES_USER:?Set POLYCOPY_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POLYCOPY_POSTGRES_PASSWORD:?Set POLYCOPY_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POLYCOPY_POSTGRES_DB:-polycopy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  bot:
    build: ./backend
    command: ["python", "-m", "polycopy.bot.daemon"]
    env_file:
      - path: .env
        required: false
    depends_on:
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${POLYCOPY_BIND_ADDRESS:-127.0.0.1}:${POLYCOPY_HTTP_PORT:-8790}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
