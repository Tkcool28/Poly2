name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: polycopy
          POSTGRES_DB: polycopy_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polycopy -d polycopy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Ruff
        run: ruff check backend/src backend/tests
      - name: Pytest
        env:
          POLYCOPY_TEST_POSTGRES_URL: postgresql+asyncpg://polycopy@localhost:5432/polycopy_test
        run: cd backend && pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: cd frontend && npm install
      - name: Build
        run: cd frontend && npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        env:
          POLYCOPY_POSTGRES_USER: ci_example_user
          POLYCOPY_POSTGRES_PASSWORD: ci_example_password
          POLYCOPY_POSTGRES_DB: ci_example_db
        run: docker compose config -q
        
